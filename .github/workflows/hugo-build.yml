name: hugo-build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    permissions:
      contents: write           # 必须：用于创建和发布 Release 以及上传资产
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.159.2'
          # extended: true

      - name: Build
        run: hugo --minify

      - name: 打包 public 目录
        run: zip -r public.zip public/

      - name: 生成北京时间作为 Release 名称
        id: date
        run: |
          # 转换为北京时间，格式如：20261001-2015
          echo "release_name=$(date -d '+8 hours' +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: 创建当前 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.release_name }}
          name: Release-${{ steps.date.outputs.release_name }}
          files: public.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动清理旧发布（只保留最新的 5 个）
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 5        # 关键配置：始终只保留最新的 5 个 Release
          delete_tags: true     # 同时删掉旧 Release 对应的 Git 标签，防止标签污染
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute remote SSH commands using SSH key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}
          username: git
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            whoami
            bash /home/ubuntu/tools/shell/feiel_blog_update.sh > /home/ubuntu/tools/shell/feiel_blog_update.log